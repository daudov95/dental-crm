services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_crm_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - dental_net

  nginx:
    image: nginx:1.28-alpine
    container_name: dental_crm_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dental_net

  postgres:
    image: postgres:17-alpine
    container_name: dental_crm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dental_crm}
      POSTGRES_USER: ${DB_USERNAME:-dental_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dental_crm_pgdata:/var/lib/postgresql/data
    networks:
      - dental_net

  redis:
    image: redis:8.4-alpine
    container_name: dental_crm_redis
    ports:
      - "6379:6379"
    networks:
      - dental_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_crm_queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    networks:
      - dental_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_crm_scheduler
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    networks:
      - dental_net

volumes:
  dental_crm_pgdata:

networks:
  dental_net:
    driver: bridge
